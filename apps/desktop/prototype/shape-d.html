// What needs the developer: failures not marked as seen, and Foreign processes. Routine restarts and doctor stay out.
function needsYou() {
  const a = [];
  for (const w of allWts()) for (const it of itemsOf(w)) {
    const g = glyphOf(it);
    if (g === 'fail' && !S.seen.has(it.id)) a.push({ it, w, text: `${it.name} ${stateWord(it)[0]}` });
    if (g === 'foreign') a.push({ it, w, text: `${it.name}, pid ${it.pid}, listens on ${it.port}, started outside Procly`, short: `${it.name}, pid ${it.pid}, outside Procly` });
  }
  return a.sort((x, y) => (glyphOf(x.it) === 'fail' ? 0 : 1) - (glyphOf(y.it) === 'fail' ? 0 : 1));
}
function wtReason(w) {
  const its = itemsOf(w);
  const fails = its.filter(i => glyphOf(i) === 'fail' && !S.seen.has(i.id)), fg = its.filter(i => i.type === 'foreign');
  if (fails.length) return [ICON.fail, fails.length === 1 ? `${fails[0].name} ${stateWord(fails[0])[0]}` : `${fails.length} ended on a failure`];
  if (fg.length) return [ICON.foreign, 'a process outside Procly'];
  return null;
}

    const kv = [];
    if (it.port) kv.push(`<span>Port</span><span style="display:flex;gap:6px;align-items:center"><button class="port" data-a="copy" data-v="${it.port}">${it.port}</button>${it.state !== 'ended' && it.type === 'service' ? `<button class="btn" data-a="browser" data-v="${it.port}">Open localhost:${it.port}</button>` : ''}</span>`);
    if (it.type === 'container') kv.push(`<span>Compose</span><span>project <code>${it.project}</code>, service <code>${it.compose}</code></span>`);
    if (it.type === 'job') kv.push(`<span>Directory</span><span class="ell"><code>${short(it.cwd)}</code></span>`, `<span>Job</span><span><code>${it.key}</code></span>`);
    if (it.reattached) kv.push('<span>Daemon</span><span>re-attached after the Daemon restarted</span>');
    if (kv.length) parts.push(`<div class="kv">${kv.join('')}</div>`);
    if ((it.type === 'service' || it.type === 'container') && it.state !== 'ended') parts.push(`<div style="display:flex;gap:6px"><button class="btn" data-a="stop">Stop</button></div>`);
    if (it.type === 'service' && w) parts.push(copyBox(restartCmd(it, w), it.state === 'ended' ? 'Start it again from a terminal' : 'Restart it from a terminal') + note('Restart is copy-only until #88 decides the environment of an up started from the app.'));
    if (it.type === 'job') parts.push(copyBox(`procly wait ${it.key}`, 'Wait for it from a terminal'));
    const at = S.fetched[it.id] || S.updated;
    parts.push(`<div style="display:flex;align-items:center;gap:6px"><span class="faint s11" style="flex:1">Output fetched at ${at}</span><button class="btn" data-a="output-refresh">Refresh</button><button class="btn" data-a="find">Find</button><button class="btn" data-a="wrap">${S.wrap ? 'No Wrap' : 'Wrap'}</button></div>
      <div class="out ${S.wrap ? 'wrap' : ''}" id="out" tabindex="0">${esc(outputFor(w || { slug: 'outside' }, it))}</div>${note('A snapshot: Logs answers once, no follow mode until #86 decides.')}`);
  }
  return `<div class="insp"><div class="bar"><div style="min-width:0"><div class="strong ell">${it.type === 'job' ? `<code style="font-size:13px">${esc(it.name)}</code>` : esc(it.name)}</div><div class="faint s11">${kindText(it)} in ${where}</div></div></div><div class="ib">${parts.join('')}</div></div>`;
}
function checkRow(c) {
  let extra = '';
  if (c.name === 'orphans') extra = '<button class="btn" data-a="view" data-v="orphans">Show Orphans</button>';
  if (c.name === 'leased_ports' && c.status === 'failed') extra = '<button class="btn" data-a="goto" data-v="acme_web_login|fgn|4812">Show the Process</button>';
  const fix = c.fix ? `<div class="fixes">${copyBox(c.fix)}${extra}</div>` : '';
  return `<div class="check">${ICON[c.status]}<div><div>${esc(c.message)}</div><code class="faint">${c.name}</code></div>${fix}</div>`;
}
function doctorView() {
  const probs = DOCTOR.filter(c => c.status === 'failed' || c.status === 'warning'), rest = DOCTOR.filter(c => !probs.includes(c));
  const passed = rest.filter(c => c.status === 'passed').length, skipped = rest.length - passed;
  return `<div class="main"><div class="bar"><div style="flex:1"><div class="title">Doctor</div><div class="faint s11">This machine and the Daemon, checked at ${S.doctorAt}. Doctor runs none of the fixes.</div></div>
      <button class="btn" data-a="copy" data-v="the prompt field of doctor --json">Copy Prompt for My Agent</button><button class="btn" data-a="rundoctor">Run Again</button></div>
    <div class="body">${probs.map(checkRow).join('')}
      <div class="check" style="cursor:default" data-a="doctor-more">${ICON.passed}<div class="muted">${passed} checks passed, ${skipped} skipped <span class="faint">${S.doctorOpen ? 'Hide' : 'Show'}</span></div></div>
      ${S.doctorOpen ? rest.map(checkRow).join('') : ''}
      <div class="faint s11" style="margin-top:14px">The checks of a Worktree (configuration, Guard, Worktrunk hooks) are in its view.</div></div></div>`;
}
function orphansView() {
  const res = S.gcResult;
  return `<div class="main"><div class="bar"><div style="flex:1"><div class="title">Orphans</div><div class="faint s11">Left behind by Worktrees git no longer lists, in every Repository.</div></div>${res ? '' : `<button class="btn" data-a="collect">Collect ${ORPHANS.length} Orphans…</button>`}</div>
    <div class="body"><div class="hd">${short(ORPHAN_WT)}, removed, slug acme_web_old</div><div class="list">${ORPHANS.map(o => `<div class="li">${res ? ICON.passed : ICON.ended}<span class="ell">${esc(o.what)}</span><span class="word ${o.data && !res ? 'red' : ''}">${res ? 'deleted' : o.loss}</span></div>`).join('')}</div>
    ${res ? `<div class="result">Collected at ${res}. 3 deleted, nothing failed, nothing skipped.</div>` : ''}</div></div>`;
}
function outsideView() {
  return `<div class="main"><div class="bar"><div class="title">Outside Repositories</div></div><div class="body"><div class="hd">Jobs started from a directory in no git Repository</div><div class="list">${rowHtml(outsideItem())}</div></div></div>`;
}
function stateScreen() {
  if (S.scenario === 'off') return `<div class="main"><div class="bar"></div><div class="body"><div class="center">${LOGO}<div class="title">The Daemon is not running</div><div class="muted">Procly shows nothing until it runs. Starting it takes back the Services a previous Daemon left running. This window updates by itself once the Daemon runs, also when you start it from a terminal.</div><button class="btn brand" data-a="start">Start the Daemon</button>${copyBox('procly unit install', 'To start it with your session instead')}</div>
    <div style="max-width:620px;margin:6px auto 0"><div class="hd">Doctor, which runs without the Daemon, at 14:01</div>${DOCTOR_OFF.map(checkRow).join('')}</div>${note('The app never starts the Daemon on its own (ADR 0009, #87).')}</div></div>`;
  if (S.scenario === 'newer') return `<div class="main"><div class="bar"></div><div class="body"><div class="center"><div class="title">This app is older than the Daemon</div><div class="muted">The Daemon runs procly 0.6.0, this app is 0.5.0. They speak different protocol versions, so the app cannot read anything from it. Restarting the Daemon from here would replace it with an older one, so the app does not offer it.</div>${copyBox('brew upgrade --cask procly', 'Update the app to match')}</div></div></div>`;
  return `<div class="main"><div class="bar"></div><div class="body"><div class="center"><div class="title">The Daemon runs an older version</div><div class="muted">It runs procly 0.4.0, this app is 0.5.0. They speak different protocol versions, so the app cannot read anything from it.</div>
    <div style="text-align:left;border:1px solid var(--line);border-radius:8px;padding:12px 14px;width:100%"><b>Restarting it stops every Service and Job of every Repository.</b><div class="muted" style="margin-top:4px">They come back once your agents or you run procly up again. The new Daemon runs 0.5.0, the release this app ships.</div></div>
    <button class="btn" data-a="mismatch-restart">Restart the Daemon…</button>${copyBox('procly daemon stop', 'Or stop it yourself from a terminal')}</div>${note('A Daemon of another version refuses Status, so nothing can be listed or counted.')}</div></div>`;
}
function sheet() {
  const s = S.sheet;
  return `<div class="sheetwrap"><div class="sheet"><div class="strong">${s.title}</div><div class="muted">${s.body}</div>${s.list ? `<ul>${s.list.map(x => `<li class="${x.loss ? 'loss' : ''}">${x.t}</li>`).join('')}</ul>` : ''}${copyBox(s.cmd, 'Same as')}
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px"><button class="btn" data-a="sheet-ok">${s.ok}</button><button class="btn default" data-a="sheet-cancel">Cancel</button></div>${note('Cancel is the default button (Return). Confirmation depth is decided in #88.')}</div></div>`;
}
function settingsWin() {
  return `<div class="settings"><div style="height:44px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);position:relative"><div class="lights" style="top:16px"><i data-a="settings-close"></i><i></i><i></i></div><span class="strong">Settings</span></div>
    <div style="padding:10px 0 16px">
      <div class="row"><span class="muted" style="text-align:right">Open Worktrees in editor</span><span><span class="select">Visual Studio Code ▾</span></span></div>
      <div class="row"><span class="muted" style="text-align:right">Open Worktrees in terminal</span><span><span class="select">Ghostty ▾</span></span></div>
      <div class="row"><span class="muted" style="text-align:right">Notifications</span><label><input type="checkbox" ${S.notify ? 'checked' : ''} data-a="notify"> Notify me when a Service ends on a failure</label></div>
      <div class="row"><span class="muted" style="text-align:right">Global shortcut</span><span class="faint">None</span></div>
      <div class="row"><span></span>${note('Notifications compare 2 Status answers, decided with #86, and need the signed bundle (#91).')}</div>
    </div></div>`;
}

// ---------- Render ----------
function render() {
  const sys = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = S.theme === 'system' ? sys : S.theme;
  if (!SCENARIOS[S.scenario]) S.scenario = 'normal';
  let win = '';
  if (S.window) {
    let center, insp = '', cls = '';
    if (blocked()) { center = stateScreen(); cls = 'single'; }
    else if (S.scenario === 'empty') { center = S.view === 'doctor' ? doctorView() : overview(); cls = 'noinsp'; }
    else if (S.view === 'wt') { center = worktreeView(); insp = inspector(); }
    else if (S.view === 'doctor') { center = doctorView(); cls = 'noinsp'; }
    else if (S.view === 'orphans') { center = orphansView(); cls = 'noinsp'; }
    else if (S.view === 'outside') { center = outsideView(); insp = inspector(); }
    else { center = overview(); insp = inspector(); }
    win = `<div class="win ${cls}"><div class="lights"><i data-a="close" title="Close"></i><i></i><i></i></div>${blocked() ? '' : sidebar()}${center}${insp}${S.sheet ? sheet() : ''}</div>`;
  }
  document.getElementById('app').innerHTML = `<div class="desk">${menubar()}${win}${S.settings ? settingsWin() : ''}${S.tray ? trayMenu() : ''}${S.menu && S.window ? appMenu() : ''}${S.ctx ? ctxMenu() : ''}</div>
    <div class="switcher"><button data-a="prev">←</button><span class="lab">D, ${SCENARIOS[S.scenario]}</span><button data-a="next">→</button><button class="opt" data-a="theme">${S.theme}</button><button class="opt" data-a="notes">notes ${S.notes ? 'on' : 'off'}</button><button class="opt" data-a="tray">menu bar</button></div>`;
}

// ---------- Events ----------
let toastTimer;
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 2800); }
function cycle(d) { const k = Object.keys(SCENARIOS); S.scenario = k[(k.indexOf(S.scenario) + d + k.length) % k.length]; const u = new URL(location); u.searchParams.set('scenario', S.scenario); history.replaceState(null, '', u); S.window = true; S.sheet = null; render(); }
function refresh() { S.refreshing = true; render(); setTimeout(() => { S.refreshing = false; S.updated = hhmmss(); render(); }, 900); }
function act(a, v, el) {
  const it = itemById(S.sel), w = it ? wtOf(it) : null;
  switch (a) {
    case 'prev': return cycle(-1);
    case 'next': return cycle(1);
    case 'theme': S.theme = { dark: 'light', light: 'system', system: 'dark' }[S.theme]; break;
    case 'notes': S.notes = !S.notes; break;
    case 'tray': S.tray = !S.tray; S.menu = null; break;
    case 'menu': S.menu = S.menu === v ? null : v; S.menuX = el ? el.getBoundingClientRect().left : 0; S.tray = false; break;
    case 'wtmenu': { const r = el.getBoundingClientRect(); S.ctx = { wt: S.wt, x: r.right - 230, y: r.bottom + 4 }; return render(); }
    case 'open': S.window = true; S.tray = false; break;
    case 'settings': S.settings = true; S.tray = false; break;
    case 'settings-close': S.settings = false; break;
    case 'notify': S.notify = !S.notify; break;
    case 'quit': toast('Quits the app. The Daemon and every Service keep running.'); break;
    case 'close': S.window = false; break;
    case 'view': S.view = v; S.window = true; break;
    case 'wt': S.view = 'wt'; S.wt = v; { const first = itemsOf(wtBySlug(v))[0]; S.sel = first ? first.id : null; } break;
    case 'goto': S.view = 'wt'; S.wt = v.split('|')[0]; S.sel = v; S.window = true; break;
    case 'sel': S.sel = v; if (!S.fetched[v]) S.fetched[v] = hhmmss(); break;
    case 'copy': toast(`Copied: ${v}`); break;
    case 'copysel': if (it) toast(`Copied: ${it.port || it.command || it.name}`); break;
    case 'browser': toast(`Opens http://localhost:${v} (Status carries the port only, the scheme is assumed)`); break;
    case 'stop': if (it && w && (it.type === 'service' || it.type === 'container') && it.state !== 'ended') toast(`Would send Down for ${it.name}, same as ${inWt(w, `down ${it.key}`)}`); break;
    case 'seen': if (it) { if (S.seen.has(it.id)) S.seen.delete(it.id); else S.seen.add(it.id); } break;
    case 'open-in': toast(`Opens ${short(wtBySlug((S.ctx && S.ctx.wt) || S.wt).path)} in ${v === 'Finder' ? 'Finder' : `the ${v} chosen in Settings`}`); break;
    case 'refresh': return refresh();
    case 'output-refresh': if (it) S.fetched[it.id] = hhmmss(); break;
    case 'find': toast('⌘F: find in this output'); break;
    case 'wrap': S.wrap = !S.wrap; break;
    case 'check': { const slug = v || S.wt; S.checked[slug] = 'running'; setTimeout(() => { S.checked[slug] = { at: hhmm(), checks: WT_CHECKS }; render(); }, 1000); break; }
    case 'rundoctor': S.doctorAt = hhmm(); toast('Would run procly doctor --json'); break;
    case 'doctor-more': S.doctorOpen = !S.doctorOpen; break;
    case 'collect': S.sheet = { kind: 'gc', title: `Collect ${ORPHANS.length} Orphans?`, body: `Everything ${short(ORPHAN_WT)} left behind goes. This cannot be undone.`, list: [{ t: 'drops the Postgres database acme_web_old and its data', loss: true }, { t: 'frees port 24081' }, { t: 'removes 1 setup directory' }], cmd: 'procly gc --apply', ok: 'Collect' }; break;
    case 'release': {
      const x = wtBySlug(v || S.wt); const its = itemsOf(x);
      const nS = its.filter(i => (i.type === 'service' || i.type === 'container') && i.state !== 'ended').length, nJ = its.filter(i => i.type === 'job' && i.state === 'running').length;
      const list = [{ t: `stops ${nS} Services and ${nJ} Job${nJ === 1 ? '' : 's'}` }, { t: 'frees its Leases, except those of a Pinned branch' }, { t: 'lets go of the Shared and Logical containers it used, which stop after their Grace period if no other Worktree needs them' }];
      if (its.some(i => i.type === 'container')) list.push({ t: 'applies the Retention policy to its Isolated containers, which may delete their data', loss: true });
      list.push({ t: 'keeps its Logical resources, they become Orphans once the Worktree is gone' });
      its.filter(i => i.type === 'foreign').forEach(f => list.push({ t: `leaves ${f.name}, pid ${f.pid}, which Procly did not start: it keeps port ${f.port}` }));
      S.sheet = { kind: 'release', slug: x.slug, title: `Release ${base(x.path)}?`, body: x.main ? 'This is the Main worktree. Releasing it does not remove it, it only stops what it holds.' : 'Do this before you remove the Worktree.', list, cmd: `procly worktree release ${x.path}`, ok: 'Release' };
      break; }
    case 'mismatch-restart': S.sheet = { kind: 'mismatch', title: 'Restart the Daemon?', body: 'The Daemon running 0.4.0 stops, with every Service and Job of every Repository. A Daemon running 0.5.0 starts.', cmd: 'procly daemon stop', ok: 'Restart' }; break;
    case 'sheet-cancel': S.sheet = null; break;
    case 'sheet-ok': { const s = S.sheet; S.sheet = null; if (s.kind === 'gc') S.gcResult = hhmm(); if (s.kind === 'release') { S.released[s.slug] = hhmm(); S.view = 'wt'; S.wt = s.slug; } if (s.kind === 'mismatch') { S.scenario = 'normal'; toast('Would run procly daemon stop --json, then connect_or_start'); } break; }
    case 'start': toast('Would call connect_or_start with the embedded procly'); S.scenario = 'normal'; break;
    case 'toast': toast(v); break;
  }
  S.ctx = null;
  render();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) { if (S.tray || S.menu || S.ctx) { S.tray = false; S.menu = null; S.ctx = null; render(); } return; }
  e.stopPropagation();
  const a = el.dataset.a;
  if (a !== 'menu' && a !== 'tray') { S.menu = null; S.tray = false; }
  act(a, el.dataset.v, el);
});
document.addEventListener('contextmenu', e => {
  const el = e.target.closest('[data-ctx], [data-wtctx]'); if (!el) return;
  e.preventDefault(); S.menu = null; S.tray = false;
  if (el.dataset.wtctx) S.ctx = { wt: el.dataset.wtctx, x: e.clientX, y: e.clientY };
  else { S.sel = el.dataset.ctx; S.ctx = { id: el.dataset.ctx, x: e.clientX, y: e.clientY }; }
  render();
});
function listIds() {
  if (S.view === 'wt') return itemsOf(wtBySlug(S.wt)).map(i => i.id);
  if (S.view === 'overview') { const ids = [...needsYou().map(x => x.it.id), ...allWts().flatMap(w => itemsOf(w).filter(i => i.type === 'service' || i.type === 'container').map(i => i.id))]; return ids.filter((id, i) => ids.indexOf(id) === i); }
  return [];
}
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  const meta = e.metaKey || e.ctrlKey;
  if (!meta && e.key === 'ArrowLeft') return cycle(-1);
  if (!meta && e.key === 'ArrowRight') return cycle(1);
  if (e.key === 'Escape') { S.tray = false; S.menu = null; S.ctx = null; S.sheet = null; S.settings = false; return render(); }
  if (S.sheet && e.key === 'Enter') { S.sheet = null; return render(); }
  if (!meta && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    const ids = listIds(); if (!ids.length) return; e.preventDefault();
    const i = ids.indexOf(S.sel); const n = ids[Math.max(0, Math.min(ids.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))]; S.sel = n; S.fetched[n] = S.fetched[n] || hhmmss(); return render();
  }
  if (!meta && e.key === 'Enter') { const o = document.getElementById('out'); if (o) o.focus(); return; }
  if (!meta) return;
  const k = e.key.toLowerCase();
  if (k === 'r') { e.preventDefault(); return act('refresh'); }
  if (k === 'c' && e.altKey) { e.preventDefault(); return act('copy', wtBySlug(S.wt).path); }
  if (k === 'c' && !window.getSelection().toString()) { e.preventDefault(); return act('copysel'); }
  if (k === '.') { e.preventDefault(); return act('stop'); }
  if (k === ',') { e.preventDefault(); return act('settings'); }
  if (k === 'd' && e.shiftKey) { e.preventDefault(); return act('view', 'doctor'); }
  if (k === '0') { e.preventDefault(); return act('view', 'overview'); }
});
render();
</script>
</body>
</html>
