[package]
name = "procly-desktop"
description = "The Procly desktop app: a window on the Daemon, a client of it like the CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "procly_desktop_lib"

[build-dependencies]
tauri-build.workspace = true

[features]
# Opens a WebDriver server on a loopback port so that `make e2e` can drive the window (ADR 0016). Off by default,
# never in a release.
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
# The time of the last state in the menu bar menu is the time of day of the machine.
chrono.workspace = true
# The `ts` feature exports the TypeScript types of the protocol while `cargo test` runs (ADR 0015).
procly-client = { workspace = true, features = ["ts"] }
# `rc` lets the last answer cross to the window while the poller shares it.
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
tauri.workspace = true
# Open at login is a LaunchAgent the plugin writes, switched from Rust and never stored by the app.
tauri-plugin-autostart.workspace = true
# A failure that enters "Needs you" makes a banner when the developer asked for it, sent from Rust only.
tauri-plugin-notification.workspace = true
# Rust opens a Worktree with the app the developer chose, the window itself holds no `opener` permission.
tauri-plugin-opener.workspace = true
tauri-plugin-wdio-webdriver = { workspace = true, optional = true }
# The window reopens where it was left, with no visible setting.
tauri-plugin-window-state.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The failures of the app are exported to TypeScript next to the types of the protocol while `cargo test` runs.
ts-rs.workspace = true
# The mock runtime lets a test send the window events of the app to its handler without opening a window.
tauri = { workspace = true, features = ["test"] }
# The paused clock runs the poller's timers without waiting for them.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
